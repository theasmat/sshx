<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160" fill="none">
  <defs>
    <!-- Background Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ebfab"/>
      <stop offset="100%" stop-color="#a6ddcb"/>
    </linearGradient>

    <!-- Key Body Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f7cb4b"/>
      <stop offset="55%" stop-color="#ecb335"/>
      <stop offset="100%" stop-color="#c97e1b"/>
    </linearGradient>

    <!-- Window Interior Clip -->
    <clipPath id="windowClip">
      <rect x="58" y="58" width="396" height="396" rx="42" ry="42"/>
    </clipPath>
  </defs>

  <!-- Left: Scaled Logo Icon (130x130) -->
  <g transform="translate(15, 15) scale(0.2539)">
    <!-- Outer Window Frame -->
    <rect x="40" y="40" width="432" height="432" rx="58" ry="58" fill="#1b4d5d"/>

    <!-- Window Content Area -->
    <g clip-path="url(#windowClip)">
      <rect x="58" y="58" width="396" height="74" fill="#1b4d5d"/>
      <rect x="58" y="132" width="396" height="322" fill="url(#screenGrad)"/>

      <!-- Terminal Prompt Window -->
      <g id="terminal-box">
        <rect x="88" y="160" width="180" height="136" rx="16" ry="16" fill="#1e4b5c"/>
        <path d="M 118 194 L 148 224 L 118 254" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="168" y1="254" x2="208" y2="254" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
      </g>

      <!-- Key Graphic -->
      <g id="security-key">
        <path d="M 316 324 L 142 324 L 122 334 Q 112 344 122 354 L 138 364 L 154 364 L 168 382 L 184 382 L 196 364 L 214 364 L 228 382 L 248 382 L 260 364 L 316 364 A 54 54 0 1 0 316 324 Z" fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 316 324 L 142 324 L 122 334 Q 112 344 122 354 L 138 364 L 154 364 L 168 382 L 184 382 L 196 364 L 214 364 L 228 382 L 248 382 L 260 364 L 316 364 A 54 54 0 1 0 316 324 Z M 388 344 A 17 17 0 1 1 354 344 A 17 17 0 1 1 388 344 Z" fill-rule="evenodd" fill="url(#keyGrad)"/>
        <rect x="146" y="339" width="134" height="9" rx="4.5" ry="4.5" fill="#fbe886" opacity="0.95"/>
      </g>
    </g>
  </g>

  <!-- Typography: SSHX -->
  <text x="175" y="105" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="78" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    SSH<tspan fill="#38BDF8">X</tspan>
  </text>
</svg>
